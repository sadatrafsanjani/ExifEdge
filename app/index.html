<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; script-src 'self'; style-src 'self' 'unsafe-inline';" />
        <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.min.css" />
        <title>ExifEdge</title>
    </head>
    <body>
        <div class="container-fluid p-4 vh-100 overflow-hidden">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="h3 mb-0">ExifEdge</h1>
                <button id="selectButton" class="btn btn-primary">Browse</button>
            </div>

            <div class="row g-4" style="height: calc(100vh - 120px);">

                <!-- Image -->
                <div class="col-md-4 h-100">
                    <div class="card h-100">
                        <div class="card-header">Image</div>
                        <div class="card-body d-flex flex-column" style="min-height: 450px;">
                            <div class="row">
                                <div id="imageContainer" class="col-md-12 text-center">
                                    <img id="imagePreview" class="img-fluid d-none" style="max-width: 80%;" />
                                </div>
                            </div>
                            <div class="row">
                                <div id="privacyRisk" class="mt-3 col-md-12">
                                </div>
                            </div>
                            <div class="mt-auto">
                                <button id="cleanButton" class="btn btn-success d-none" disabled>Clean</button>
                                <button id="cancelButton" class="btn btn-danger d-none" disabled>Cancel</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Metadata -->
                <div class="col-md-8 h-100">
                    <div class="card h-100">
                        <div class="card-header">Metadata</div>
                        <div class="card-body overflow-auto">
                            <div id="metadata" class="font-monospace small text-secondary"></div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
        <script src="script.js"></script>
    </body>
</html>
