<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; script-src 'self'; style-src 'self' 'unsafe-inline';" />
        <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.min.css" />
        <link rel="stylesheet" href="../assets/css/style.css" />
        <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
        <title>ExifEdge</title>
    </head>
    <body>
        <div class="container-fluid p-4 vh-100 overflow-hidden">

            <!-- FILE BROWSER -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="h3 mb-0">ExifEdge <span class="fw-light text-info-emphasis tagline">Privacy Matters!</span></h1>
                <button id="selectButton" class="btn btn-outline-primary">Browse</button>
            </div><!-- FILE BROWSER END -->

            <div class="row g-4" style="height: calc(100vh - 120px);">

                <!-- LEFT IMAGE VIEWER -->
                <div class="col-md-4 h-100">
                    <div class="card h-100">
                        <div class="card-header bg-primary text-light">Image</div>
                        <div class="card-body d-flex flex-column overflow-auto" style="min-height: 450px;">
                            <div class="row">
                                <div id="imageContainer" class="col-md-12 text-center">
                                    <div class="position-relative d-inline-block">
                                        <img id="imagePreview" class="img-fluid d-none" style="max-width: 60%; max-height: 50%" alt="Image Preview"/>
                                        <div id="aiGeneratedOverlay" class="position-absolute top-0 start-50 translate-middle-x mt-2 d-none">
                                            <span class="badge text-bg-warning fs-6">⚠ AI GENERATED</span>
                                        </div>
                                    </div>
                                    <div id="imageName" class="small text-secondary mt-2 d-none fw-bold"></div>
                                </div>
                            </div>

                            <!-- PRIVACY VIEWER -->
                            <div class="row">
                                <div id="privacyRisk" class="mt-3 mb-3 col-md-12">
                                </div>
                            </div><!-- PRIVACY VIEWER END -->

                            <div class="mt-auto">
                                <button id="cleanButton" class="btn btn-outline-success d-none" disabled>Clean</button>
                                <button id="cancelButton" class="btn btn-outline-danger d-none" disabled>Cancel</button>
                            </div>
                        </div>
                    </div>
                </div><!-- LEFT IMAGE VIEWER END -->

                <!-- RIGHT METADATA VIEWER -->
                <div class="col-md-8 h-100">
                    <div class="card h-100">
                        <div class="card-header bg-primary text-light">Metadata</div>
                        <div class="card-body overflow-auto">
                            <div id="metadata" class="font-monospace small text-secondary"></div>
                        </div>
                    </div>
                </div><!-- RIGHT METADATA VIEWER END -->
            </div>

            <!-- TOAST -->
            <div class="toast-container position-fixed bottom-0 end-0 p-3">

                <!-- SUCCESS TOAST -->
                <div id="successToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
                    <div class="toast-header bg-success">
                        <strong class="me-auto text-light">Success</strong>
                        <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
                    </div>
                    <div class="toast-body bg-success text-light">Image cleaned successfully.</div>
                </div><!-- SUCCESS TOAST END -->

                <!-- FAIL TOAST -->
                <div id="failToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
                    <div class="toast-header bg-danger">
                        <strong class="me-auto text-light">Failed!</strong>
                        <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
                    </div>
                    <div class="toast-body bg-danger text-light">Image cleaned failed!</div>
                </div><!-- FAIL TOAST END -->

                <!-- FAIL IMAGE LOAD TOAST -->
                <div id="failImageLoadingToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
                    <div class="toast-header bg-danger">
                        <strong class="me-auto text-light">Failed!</strong>
                        <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
                    </div>
                    <div class="toast-body bg-danger text-light">Image loading failed!</div>
                </div><!-- FAIL IMAGE LOAD TOAST END -->

            </div><!-- TOAST END -->

        </div>
        <script src="core/renderer.js"></script>
    </body>
</html>
